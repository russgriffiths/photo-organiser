services:
  organiser:
    build: .
    image: photo-organiser:latest
    restart: unless-stopped
    # UID:GID of the photo-organiser user on the NAS. Check in DSM and replace.
    user: "1030:100"
    ports:
      - "5000:5000"
    environment:
      - TZ=Europe/London
    volumes:
      - photos:/photos
      - ./data:/data

volumes:
  photos:
    driver: local
    driver_opts:
      type: nfs
      # Replace with the NAS address and export path.
      o: "addr=192.168.1.20,nfsvers=4.1,rw,hard"
      device: ":/volume1/Photos"
